<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e00012">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">

<style>

:root{
  --red:#e00012;
  --red-dark:#b90010;
  --red-soft:#fff1f2;
  --bg:#f3f4f6;
  --card:#fff;
  --text:#171717;
  --muted:#737373;
  --border:#e4e4e7;
  --shadow:0 3px 12px rgba(0,0,0,.06);
}

*{
  box-sizing:border-box
}

html{
  font-size:16px;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:14px;
  line-height:1.35;
  zoom:1;
}

button,select{
  font:inherit
}

button{
  cursor:pointer
}


/* =========================================================
   HEADER
========================================================= */

header{
  background:var(--red);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px max(16px,calc((100% - 1040px)/2));
  min-height:72px;
}

header h1{
  font-size:25px;
  line-height:1.05;
  margin:0 0 3px;
  font-weight:800;
}

header small{
  font-size:14px;
  opacity:.9
}

#refresh{
  border:0;
  background:rgba(255,255,255,.13);
  color:#fff;
  width:48px;
  height:48px;
  border-radius:15px;
  font-size:28px;
  line-height:1;
}


/* =========================================================
   MAIN
========================================================= */

main{
  width:min(1040px,100%);
  margin:0 auto;
  padding:16px 16px 36px;
}


/* =========================================================
   ONGLETS
========================================================= */

.module-tabs{
  display:flex;
  gap:8px;
  margin:0 0 14px;
  overflow-x:auto;
  scrollbar-width:none;
}

.module-tabs::-webkit-scrollbar{
  display:none;
}

.module-tab{
  flex:0 0 auto;
  height:44px;
  padding:0 17px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#fff;
  color:#222;
  font-weight:750;
  font-size:14px;
  box-shadow:var(--shadow);
  transition:
    background .15s ease,
    color .15s ease,
    border-color .15s ease,
    transform .1s ease;
}

.module-tab:active{
  transform:scale(.98);
}

.module-tab.active{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
}


/* =========================================================
   FILTRES
========================================================= */

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:12px;
}

.filters label{
  display:flex;
  flex-direction:column;
  gap:5px;
  color:#666;
  font-size:14px;
}

select{
  width:100%;
  height:48px;
  border:1px solid #d8d8dc;
  border-radius:13px;
  background:#fff;
  padding:0 14px;
  color:#171717;
  outline:none;
}

select:focus{
  border-color:var(--red);
  box-shadow:0 0 0 2px rgba(224,0,18,.1);
}


/* =========================================================
   STATS
========================================================= */

.stats{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 1px 12px;
  scrollbar-width:thin;
}

.stat{
  flex:0 0 auto;
  min-width:105px;
  height:58px;
  border:1px solid transparent;
  border-radius:15px;
  background:#fff;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:#171717;
  font-weight:700;
  font-size:16px;
  padding:0 12px;
}

.stat-icon{
  font-size:18px;
  color:var(--red)
}

.stat.active{
  border-color:var(--red);
  background:var(--red-soft);
  color:var(--red)
}


/* =========================================================
   EVENTS
========================================================= */

#events{
  display:grid;
  gap:12px
}

.event{
  background:var(--card);
  border-radius:18px;
  padding:16px;
  box-shadow:var(--shadow);
  border:1px solid #eee;
}

.event-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.date{
  display:block;
  color:var(--red);
  font-weight:800;
  font-size:13px;
  margin-bottom:3px;
}

.title{
  font-size:19px;
  line-height:1.18;
  margin:0 0 5px;
  font-weight:800;
}

.place{
  margin:0;
  color:#666;
  font-size:15px;
}

.description{
  margin:10px 0;
  color:#4b4b4b;
  font-size:14px;
}

.fav{
  border:0;
  background:var(--red-soft);
  color:var(--red);
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:14px;
  font-size:27px;
  line-height:1;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:10px 0;
}

.badges span{
  background:#f1f1f2;
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  color:#333;
}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:9px;
}

.actions button{
  border:0;
  border-radius:12px;
  height:44px;
  background:#eee;
  color:#111;
  font-weight:750;
  font-size:14px;
}

.actions .flight{
  background:var(--red);
  color:#fff
}

.empty{
  text-align:center;
  color:#777;
  font-size:17px;
  padding:55px 16px
}


/* =========================================================
   AGRICULTURE
========================================================= */

#agricultureModule{
  width:100%;
}

.agri-page{
  width:100%;
}

.agri-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  margin-bottom:16px;
}

.agri-kicker{
  color:var(--red);
  font-size:13px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.agri-header h2{
  margin:3px 0 4px;
  font-size:24px;
  line-height:1.15;
  font-weight:800;
}

.agri-header p{
  margin:0;
  color:var(--muted);
  font-size:14px;
}

.agri-sector{
  flex:0 0 auto;
  background:#fff;
  border:1px solid var(--border);
  border-radius:13px;
  padding:9px 13px;
  font-weight:700;
  box-shadow:var(--shadow);
}

.agri-info{
  display:flex;
  flex-direction:column;
  gap:3px;
  background:#f0faf4;
  border:1px solid #ccebd8;
  border-radius:15px;
  padding:14px 16px;
  margin-bottom:14px;
}

.agri-info span{
  color:#666;
  font-size:13px;
}

.agri-list{
  display:grid;
  gap:12px;
}

.agri-card{
  background:var(--card);
  border-radius:18px;
  padding:16px;
  box-shadow:var(--shadow);
  border:1px solid #eee;
}

.agri-card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
}

.agri-type{
  font-size:18px;
  font-weight:800;
  line-height:1.2;
}

.agri-period{
  margin-top:5px;
  color:#666;
  font-size:14px;
}

.agri-stars{
  color:var(--red);
  font-size:20px;
  white-space:nowrap;
  line-height:1;
}

.agri-prospect{
  display:flex;
  flex-direction:column;
  gap:3px;
  margin:14px 0;
  padding:12px 14px;
  background:var(--red-soft);
  border-radius:13px;
  color:#222;
}

.agri-prospect span{
  color:#666;
  font-size:13px;
}

.agri-detail{
  margin-top:9px;
  color:#4b4b4b;
  font-size:14px;
  line-height:1.45;
}

.agri-detail strong{
  color:#222;
}

.agri-note{
  margin-top:14px;
  padding:12px 14px;
  color:#666;
  font-size:12px;
  line-height:1.45;
  background:#eee;
  border-radius:12px;
}

.agri-error{
  background:#fff;
  border:1px solid #eee;
  border-radius:18px;
  padding:20px;
  text-align:center;
  color:#777;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:700px){

  header{
    padding:11px 14px;
    min-height:68px;
  }

  header h1{
    font-size:22px
  }

  header small{
    font-size:13px
  }

  #refresh{
    width:44px;
    height:44px;
    border-radius:14px;
    font-size:25px;
  }

  main{
    padding:12px 12px 30px
  }

  .module-tabs{
    margin-bottom:12px;
  }

  .module-tab{
    height:42px;
    padding:0 15px;
    font-size:13px;
    border-radius:12px;
  }

  .filters{
    gap:9px
  }

  .filters label{
    font-size:13px
  }

  select{
    height:46px;
    padding:0 11px;
    border-radius:12px;
  }

  .stats{
    gap:7px;
    padding-bottom:10px
  }

  .stat{
    min-width:94px;
    height:54px;
    border-radius:14px;
    font-size:15px;
    padding:0 10px;
  }

  .stat-icon{
    font-size:17px
  }

  #events{
    gap:10px
  }

  .event{
    padding:14px;
    border-radius:17px;
  }

  .event-top{
    gap:9px
  }

  .date{
    font-size:12px
  }

  .title{
    font-size:18px
  }

  .place{
    font-size:14px
  }

  .description{
    margin:8px 0;
    font-size:13px;
  }

  .fav{
    width:40px;
    height:40px;
    min-width:40px;
    border-radius:13px;
    font-size:25px;
  }

  .badges{
    gap:5px;
    margin:8px 0
  }

  .badges span{
    padding:5px 8px;
    font-size:11px;
  }

  .actions{
    gap:7px;
    margin-top:8px;
  }

  .actions button{
    height:42px;
    border-radius:11px;
    font-size:13px;
  }

  .agri-header{
    flex-direction:column;
    gap:10px;
  }

  .agri-sector{
    width:100%;
  }

  .agri-header h2{
    font-size:21px;
  }

  .agri-type{
    font-size:17px;
  }

  .agri-card{
    padding:14px;
    border-radius:17px;
  }

}

@media (max-width:430px){

  .filters{
    grid-template-columns:1fr 1fr
  }

  .stat{
    min-width:88px
  }

}

</style>

<title>Événements Drone</title>
</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

  <div>
    <h1>Événements Drone</h1>
    <small id="updated">Actualisation…</small>
  </div>

  <button id="refresh" title="Actualiser">↻</button>

</header>


<main>


<!-- =========================================================
     ONGLETS
========================================================= -->

<section class="module-tabs">

  <button
    type="button"
    id="tabEvents"
    class="module-tab active"
  >
    📅 Événements
  </button>

  <button
    type="button"
    id="tabAgriculture"
    class="module-tab"
  >
    🌾 Agriculture
  </button>

</section>


<!-- =========================================================
     MODULE ÉVÉNEMENTS
========================================================= -->

<section id="eventsModule">

  <section class="filters">

    <label>
      Distance

      <select id="distance">
        <option value="10">10 km</option>
        <option value="20">20 km</option>
        <option value="30" selected>30 km</option>
        <option value="50">50 km</option>
        <option value="100">100 km</option>
      </select>
    </label>


    <label>
      Afficher

      <select id="statusFilter">

        <option value="potential" selected>
          ⭐ Potentiel drone
        </option>

        <option value="high">
          ⭐ Potentiel élevé
        </option>

        <option value="medium">
          🟢 Potentiel
        </option>

        <option value="outdoor">
          🚁 Extérieur
        </option>

        <option value="all">
          📅 Tous
        </option>

        <option value="fav">
          ⭐ Favoris
        </option>

        <option value="todo">
          📞 À contacter
        </option>

        <option value="contacted">
          📞 Contactés
        </option>

        <option value="accepted">
          🟢 Vol accepté
        </option>

        <option value="refused">
          🔴 Vol refusé
        </option>

      </select>

    </label>

  </section>


  <section
    id="stats"
    class="stats"
  ></section>


  <section id="events"></section>

</section>


<!-- =========================================================
     MODULE AGRICULTURE
========================================================= -->

<section
  id="agricultureModule"
  hidden
>

  <div id="agriculture"></div>

</section>


</main>


<!-- =========================================================
     TEMPLATE ÉVÉNEMENT
========================================================= -->

<template id="eventTemplate">

  <article class="event">

    <div class="event-top">

      <div>

        <span class="date"></span>

        <h2 class="title"></h2>

        <p class="place"></p>

      </div>

      <button class="fav">
        ☆
      </button>

    </div>


    <p class="description"></p>


    <div class="badges">

      <span class="distance-badge"></span>
      <span class="potential-badge"></span>
      <span class="outdoor-badge"></span>
      <span class="contact-badge"></span>
      <span class="flight-badge"></span>

    </div>


    <div class="actions">

      <button class="contact">
        📞 Contact
      </button>

      <button class="flight">
        🚁 Vol
      </button>

      <button class="details">
        Détails
      </button>

    </div>

  </article>

</template>


<!-- =========================================================
     APPLICATION EXISTANTE
========================================================= -->

<script src="app.js"></script>


<!-- =========================================================
     PLUGIN AGRICULTURE
========================================================= -->

<script src="plugin/agriculture/agriculture.js"></script>


<!-- =========================================================
     GESTION DES ONGLETS
========================================================= -->

<script>

(function(){

  const tabEvents =
    document.getElementById('tabEvents');

  const tabAgriculture =
    document.getElementById('tabAgriculture');

  const eventsModule =
    document.getElementById('eventsModule');

  const agricultureModule =
    document.getElementById('agricultureModule');

  const agricultureContainer =
    document.getElementById('agriculture');

  let agricultureLoaded = false;


  function showEvents(){

    eventsModule.hidden = false;

    agricultureModule.hidden = true;

    tabEvents.classList.add('active');

    tabAgriculture.classList.remove('active');

  }


  async function showAgriculture(){

    eventsModule.hidden = true;

    agricultureModule.hidden = false;

    tabEvents.classList.remove('active');

    tabAgriculture.classList.add('active');


    if(
      !agricultureLoaded &&
      window.EventDroneAgriculture
    ){

      agricultureLoaded = true;

      await window.EventDroneAgriculture.init(
        agricultureContainer
      );

    }

  }


  tabEvents.addEventListener(
    'click',
    showEvents
  );


  tabAgriculture.addEventListener(
    'click',
    showAgriculture
  );


  showEvents();

})();

</script>


</body>
</html>
