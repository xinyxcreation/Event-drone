<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e00012">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>

:root{
  --red:#e00012;
  --red-dark:#b90010;
  --red-soft:#fff1f2;
  --bg:#f3f4f6;
  --card:#fff;
  --text:#171717;
  --muted:#737373;
  --border:#e4e4e7;
  --shadow:0 3px 12px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html{
  font-size:16px;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:14px;
  line-height:1.35;
  zoom:1;
}
button,select{font:inherit}
button{cursor:pointer}

header{
  background:var(--red);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px max(16px,calc((100% - 900px)/2));
  min-height:72px;
}
header h1{
  font-size:25px;
  line-height:1.05;
  margin:0 0 3px;
  font-weight:800;
}
header small{font-size:14px;opacity:.9}
#refresh{
  border:0;
  background:rgba(255,255,255,.13);
  color:#fff;
  width:48px;
  height:48px;
  border-radius:15px;
  font-size:28px;
  line-height:1;
}

main{
  width:min(800px,100%);
  margin:0 auto;
  padding:16px 16px 36px;
}
.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:12px;
}
.filters label{
  display:flex;
  flex-direction:column;
  gap:5px;
  color:#666;
  font-size:14px;
}
select{
  width:100%;
  height:48px;
  border:1px solid #d8d8dc;
  border-radius:13px;
  background:#fff;
  padding:0 14px;
  color:#171717;
  outline:none;
}
select:focus{
  border-color:var(--red);
  box-shadow:0 0 0 2px rgba(224,0,18,.1);
}

.stats{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 1px 12px;
  scrollbar-width:thin;
}
.stat{
  flex:0 0 auto;
  min-width:105px;
  height:58px;
  border:1px solid transparent;
  border-radius:15px;
  background:#fff;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:#171717;
  font-weight:700;
  font-size:16px;
  padding:0 12px;
}
.stat-icon{font-size:18px;color:var(--red)}
.stat.active{border-color:var(--red);background:var(--red-soft);color:var(--red)}

#events{display:grid;gap:12px}
.event{
  background:var(--card);
  border-radius:18px;
  padding:16px;
  box-shadow:var(--shadow);
  border:1px solid #eee;
}
.event-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}
.date{
  display:block;
  color:var(--red);
  font-weight:800;
  font-size:13px;
  margin-bottom:3px;
}
.title{
  font-size:19px;
  line-height:1.18;
  margin:0 0 5px;
  font-weight:800;
}
.place{
  margin:0;
  color:#666;
  font-size:15px;
}
.description{
  margin:10px 0;
  color:#4b4b4b;
  font-size:14px;
}
.fav{
  border:0;
  background:var(--red-soft);
  color:var(--red);
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:14px;
  font-size:27px;
  line-height:1;
}
.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:10px 0;
}
.badges span{
  background:#f1f1f2;
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  color:#333;
}
.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:9px;
}
.actions button{
  border:0;
  border-radius:12px;
  height:44px;
  background:#eee;
  color:#111;
  font-weight:750;
  font-size:14px;
}
.actions .flight{background:var(--red);color:#fff}
.empty{text-align:center;color:#777;font-size:17px;padding:55px 16px}

@media (max-width:700px){
  header{
    padding:11px 14px;
    min-height:68px;
  }
  header h1{font-size:22px}
  header small{font-size:13px}
  #refresh{
    width:44px;
    height:44px;
    border-radius:14px;
    font-size:25px;
  }
  main{padding:12px 12px 30px}
  .filters{gap:9px}
  .filters label{font-size:13px}
  select{
    height:46px;
    padding:0 11px;
    border-radius:12px;
  }
  .stats{gap:7px;padding-bottom:10px}
  .stat{
    min-width:94px;
    height:54px;
    border-radius:14px;
    font-size:15px;
    padding:0 10px;
  }
  .stat-icon{font-size:17px}
  #events{gap:10px}
  .event{
    padding:14px;
    border-radius:17px;
  }
  .event-top{gap:9px}
  .date{font-size:12px}
  .title{font-size:18px}
  .place{font-size:14px}
  .description{
    margin:8px 0;
    font-size:13px;
  }
  .fav{
    width:40px;
    height:40px;
    min-width:40px;
    border-radius:13px;
    font-size:25px;
  }
  .badges{gap:5px;margin:8px 0}
  .badges span{
    padding:5px 8px;
    font-size:11px;
  }
  .actions{
    gap:7px;
    margin-top:8px;
  }
  .actions button{
    height:42px;
    border-radius:11px;
    font-size:13px;
  }
}
@media (max-width:430px){
  .filters{grid-template-columns:1fr 1fr}
  .stat{min-width:88px}
}

</style>
<title>Événements Drone</title>
</head>
<body>
<header>
  <div><h1>Événements Drone</h1><small id="updated">Actualisation…</small></div>
  <button id="refresh" title="Actualiser">↻</button>
</header>
<main>
<section class="filters">
  <label>Distance
    <select id="distance">
      <option value="10">10 km</option><option value="20">20 km</option>
      <option value="30" selected>30 km</option><option value="50">50 km</option><option value="100">100 km</option>
    </select>
  </label>
  <label>Afficher
    <select id="statusFilter">
      <option value="potential" selected>⭐ Potentiel drone</option>
      <option value="high">⭐ Potentiel élevé</option>
      <option value="medium">🟢 Potentiel</option>
      <option value="outdoor">🚁 Extérieur</option>
      <option value="all">📅 Tous</option>
      <option value="fav">⭐ Favoris</option>
      <option value="todo">📞 À contacter</option>
      <option value="contacted">📞 Contactés</option>
      <option value="accepted">🟢 Vol accepté</option>
      <option value="refused">🔴 Vol refusé</option>
    </select>
  </label>
</section>
<section id="stats" class="stats"></section>
<section id="events"></section>
</main>
<template id="eventTemplate">
<article class="event">
  <div class="event-top"><div><span class="date"></span><h2 class="title"></h2><p class="place"></p></div><button class="fav">☆</button></div>
  <p class="description"></p>
  <div class="badges"><span class="distance-badge"></span><span class="potential-badge"></span><span class="outdoor-badge"></span><span class="contact-badge"></span><span class="flight-badge"></span></div>
  <div class="actions"><button class="contact">📞 Contact</button><button class="flight">🚁 Vol</button><button class="details">Détails</button></div>
</article>
</template>
<script src="app.js"></script>
</body>
</html>
