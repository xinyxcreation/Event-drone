<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e00012">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>Événements Drone</title>
</head>
<body>
<header>
  <div>
    <h1>Événements Drone</h1>
    <small id="updated">Actualisation…</small>
  </div>
  <button id="refresh" class="icon-button" title="Actualiser" aria-label="Actualiser">↻</button>
</header>

<main>
<section class="city-picker">
  <div class="city-picker-head">
    <div>
      <span class="eyebrow">SECTEUR DE RECHERCHE</span>
      <h2>Où veux-tu prospecter ?</h2>
    </div>
    <span class="pin-icon">⌖</span>
  </div>

  <div class="city-search">
    <span class="search-icon">⌕</span>
    <input id="sector" type="search" autocomplete="off"
           placeholder="Ville ou code postal…"
           aria-label="Ville ou code postal">
    <button id="sectorSearch" class="search-button" aria-label="Rechercher">Rechercher</button>
  </div>

  <div id="citySuggestions" class="city-suggestions" hidden></div>

  <div class="selected-city">
    <span class="selected-dot"></span>
    <div>
      <strong id="selectedCity">Châteaubriant</strong>
      <small id="sectorStatus">Secteur actif</small>
    </div>
    <button id="clearCity" class="clear-city" title="Revenir à Châteaubriant">×</button>
  </div>

  <p class="city-help">Les distances et le potentiel sont recalculés depuis ce secteur.</p>
</section>

<section class="filters">
  <label>Distance
    <select id="distance">
      <option value="10">10 km</option>
      <option value="20">20 km</option>
      <option value="30" selected>30 km</option>
      <option value="50">50 km</option>
      <option value="100">100 km</option>
      <option value="150">150 km</option>
    </select>
  </label>
  <label>Afficher
    <select id="statusFilter">
      <option value="all">Tous</option>
      <option value="outdoor">🚁 Extérieur</option>
      <option value="star1">★ Potentiel</option>
      <option value="star2">★★ Potentiel élevé</option>
      <option value="star3">★★★ Très haut potentiel</option>
      <option value="fav">⭐ Favoris</option>
      <option value="todo">📞 À contacter</option>
      <option value="contacted">📞 Contactés</option>
      <option value="accepted">🟢 Vol accepté</option>
      <option value="refused">🔴 Vol refusé</option>
    </select>
  </label>
</section>

<section id="stats" class="stats" aria-label="Statistiques rapides"></section>
<section id="events"></section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close-modal></div>
  <section class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" data-close-modal aria-label="Fermer">×</button>
    <div id="modalContent"></div>
  </section>
</div>

<template id="eventTemplate">
<article class="event">
  <div class="event-top">
    <div>
      <span class="date"></span>
      <h2 class="title"></h2>
      <p class="place"></p>
    </div>
    <button class="fav" aria-label="Ajouter aux favoris">☆</button>
  </div>
  <p class="description"></p>
  <div class="badges">
    <span class="distance-badge"></span>
    <span class="potential-badge"></span>
    <span class="outdoor-badge"></span>
    <span class="contact-badge"></span>
    <span class="flight-badge"></span>
  </div>
  <div class="actions">
    <button class="contact">📞 Contact</button>
    <button class="flight">🚁 Vol</button>
    <button class="details">Détails</button>
  </div>
</article>
</template>

<script src="app.js"></script>
</body>
</html>
