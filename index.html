<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e00012">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">

<!-- Plugin Agriculture -->
<link rel="stylesheet" href="plugin/agriculture/agriculture.css">

<title>Événements Drone</title>
</head>

<body>

<header>
  <div>
    <h1>Événements Drone</h1>
    <small id="updated">Actualisation…</small>
  </div>

  <button id="refresh" title="Actualiser">↻</button>
</header>

<main>

<!-- =========================================================
     NAVIGATION DES MODULES
========================================================= -->

<section class="module-tabs">

  <button
    type="button"
    id="tabEvents"
    class="module-tab active"
  >
    📅 Événements
  </button>

  <button
    type="button"
    id="tabAgriculture"
    class="module-tab"
  >
    🌾 Agriculture
  </button>

</section>


<!-- =========================================================
     MODULE ÉVÉNEMENTS
========================================================= -->

<section id="eventsModule">

  <section class="filters">

    <label>
      Distance

      <select id="distance">
        <option value="10">10 km</option>
        <option value="20">20 km</option>
        <option value="30" selected>30 km</option>
        <option value="50">50 km</option>
        <option value="100">100 km</option>
      </select>
    </label>


    <label>
      Afficher

      <select id="statusFilter">

        <option value="potential" selected>
          ⭐ Potentiel drone
        </option>

        <option value="high">
          ⭐ Potentiel élevé
        </option>

        <option value="medium">
          🟢 Potentiel
        </option>

        <option value="outdoor">
          🚁 Extérieur
        </option>

        <option value="all">
          📅 Tous
        </option>

        <option value="fav">
          ⭐ Favoris
        </option>

        <option value="todo">
          📞 À contacter
        </option>

        <option value="contacted">
          📞 Contactés
        </option>

        <option value="accepted">
          🟢 Vol accepté
        </option>

        <option value="refused">
          🔴 Vol refusé
        </option>

      </select>
    </label>

  </section>


  <section
    id="stats"
    class="stats"
  ></section>


  <section
    id="events"
  ></section>

</section>


<!-- =========================================================
     MODULE AGRICULTURE
========================================================= -->

<section
  id="agricultureModule"
  hidden
>

  <div id="agriculture"></div>

</section>


</main>


<!-- =========================================================
     MODÈLE D'UN ÉVÉNEMENT
========================================================= -->

<template id="eventTemplate">

  <article class="event">

    <div class="event-top">

      <div>

        <span class="date"></span>

        <h2 class="title"></h2>

        <p class="place"></p>

      </div>

      <button class="fav">
        ☆
      </button>

    </div>


    <p class="description"></p>


    <div class="badges">

      <span class="distance-badge"></span>

      <span class="potential-badge"></span>

      <span class="outdoor-badge"></span>

      <span class="contact-badge"></span>

      <span class="flight-badge"></span>

    </div>


    <div class="actions">

      <button class="contact">
        📞 Contact
      </button>

      <button class="flight">
        🚁 Vol
      </button>

      <button class="details">
        Détails
      </button>

    </div>

  </article>

</template>


<!-- =========================================================
     STYLE DES ONGLETS
========================================================= -->

<style>

.module-tabs {
  display: flex;
  gap: 8px;
  margin: 0 0 14px;
  padding: 0;
}

.module-tab {
  appearance: none;
  border: 1px solid rgba(127,127,127,.22);
  background: rgba(127,127,127,.06);
  color: inherit;
  border-radius: 12px;
  padding: 9px 14px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition:
    background .15s ease,
    border-color .15s ease,
    transform .15s ease;
}

.module-tab:hover {
  transform: translateY(-1px);
}

.module-tab.active {
  background: #e00012;
  border-color: #e00012;
  color: #fff;
}

</style>


<!-- =========================================================
     APPLICATION PRINCIPALE
========================================================= -->

<script src="app.js"></script>


<!-- =========================================================
     PLUGIN AGRICULTURE
========================================================= -->

<script src="plugin/agriculture/agriculture.js"></script>


<!-- =========================================================
     GESTION DES ONGLETS
========================================================= -->

<script>

(function () {

  const tabEvents = document.getElementById('tabEvents');
  const tabAgriculture = document.getElementById('tabAgriculture');

  const eventsModule = document.getElementById('eventsModule');
  const agricultureModule = document.getElementById('agricultureModule');

  const agricultureContainer =
    document.getElementById('agriculture');


  function showEvents() {

    eventsModule.hidden = false;
    agricultureModule.hidden = true;

    tabEvents.classList.add('active');
    tabAgriculture.classList.remove('active');

  }


  async function showAgriculture() {

    eventsModule.hidden = true;
    agricultureModule.hidden = false;

    tabEvents.classList.remove('active');
    tabAgriculture.classList.add('active');

    if (
      window.EventDroneAgriculture &&
      agricultureContainer
    ) {

      await window.EventDroneAgriculture.init(
        agricultureContainer
      );

    }

  }


  tabEvents.addEventListener(
    'click',
    showEvents
  );


  tabAgriculture.addEventListener(
    'click',
    showAgriculture
  );


  showEvents();

})();

</script>


</body>
</html>
