<!--
  INTÉGRATION DANS EVENT-DRONE

  1. Ajouter le bouton/onglet :
-->
<button type="button" data-page="agriculture">🌾 Agriculture</button>

<!--
  2. Ajouter un conteneur :
-->
<section id="agriculture" hidden></section>

<!--
  3. Charger les fichiers :
-->
<link rel="stylesheet" href="agriculture.css">
<script src="agriculture.js"></script>

<!--
  4. Lors de l'ouverture de l'onglet :
-->
<script>
async function openAgriculture() {
  const page = document.querySelector('#agriculture');
  page.hidden = false;

  try {
    await Agriculture.load();
    Agriculture.render(page);
  } catch (error) {
    console.error(error);
    page.innerHTML =
      '<p>Impossible de charger le calendrier agricole.</p>';
  }
}
</script>
