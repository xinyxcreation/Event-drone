name: Mise à jour automatique des événements

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-events.yml"
      - "scripts/build_events.py"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger les événements
        run: |
          mkdir -p data
          curl -L --fail --retry 3 --retry-delay 2             "https://data.loire-atlantique.fr/api/explore/v2.1/catalog/datasets/793866443_fetes-et-manifestations-en-loire-atlantique/exports/json?limit=10000"             -o data/source-events.json
          ls -lh data/source-events.json

      - name: Générer events.json
        run: python3 scripts/build_events.py

      - name: Vérifier les événements
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("events.json",encoding="utf-8"))
          n=len(d.get("events",[]))
          print("Événements dans events.json :",n)
          if n == 0:
              raise SystemExit("Aucun événement généré")
          PY

      - name: Publier events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if git diff --cached --quiet; then
            echo "Aucune modification."
          else
            git commit -m "chore: actualisation automatique des événements"
            git push
          fi
