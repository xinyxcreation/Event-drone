name: Mise à jour des événements

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger les données
        run: |
          mkdir -p data
          curl -L --fail --retry 3             "https://data.loire-atlantique.fr/api/explore/v2.1/catalog/datasets/793866443_fetes-et-manifestations-en-loire-atlantique/exports/json?limit=10000"             -o data/source-events.json

      - name: Générer les événements
        run: python3 scripts/build_events.py

      - name: Vérifier le résultat
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("events.json"))
          n=len(d.get("events",[]))
          print(f"{n} événements générés")
          if n == 0:
              raise SystemExit("ERREUR: 0 événement généré")
          PY

      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json data/source-events.json
          git diff --cached --quiet || git commit -m "chore: mise à jour des événements"
          git push
